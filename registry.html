<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Wallet Reporters — Registry</title>
  <script>window.WR_API_BASE="https://wallet-reporters-api.bmmthpfbrs.workers.dev";</script>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
  <main class="container">
    <h1>Verified Registry</h1>
    <p class="wr-note">This page calls <code>https://wallet-reporters-api.bmmthpfbrs.workers.dev/api/registry</code>.</p>
    <pre id="out" class="wr-card" style="overflow:auto;"></pre>
  </main>
  <script>
    (async function() {
      const out = document.getElementById('out');
      try {
        const res = await fetch(window.WR_API_BASE.replace(/\/+$/,'') + '/api/registry');
        const txt = await res.text();
        out.textContent = txt;
      } catch (e) {
        out.textContent = String(e);
      }
    })();
  </script>
</body>
</html>
