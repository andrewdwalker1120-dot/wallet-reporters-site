<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Registry • Wallet Reporters</title>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
  <div class="topbar">
    <div class="container">
      <div class="topbar-inner">
        <div class="brand">
          <img src="./assets/logo.png" alt="Wallet Reporters logo" onerror="this.style.display='none'"/>
          <div>
            <div class="brand-title">Wallet Reporters</div>
            <div class="brand-sub">Registry</div>
          </div>
        </div>
        <div class="actions">
          <a class="btn" href="./index.html">Home</a>
          <button class="btn btn-green" id="openReportTop">Report a Wallet →</button>
        </div>
      </div>
    </div>
  </div>

  <main class="container" style="padding-top:22px">
    <div class="card">
      <h2 style="margin:0 0 8px">Search the Registry</h2>
      <p style="margin:0 0 14px;color:var(--muted)">Demo list stored in your browser. Replace with backend later.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <input id="searchWallet" class="wr-input" placeholder="Paste a wallet address…"/>
        <button class="btn btn-dark" id="searchBtn">Search</button>
      </div>
      <div id="searchResult" style="margin-top:12px;color:var(--muted)"></div>
    </div>

    <div class="card" style="margin-top:14px">
      <h2 style="margin:0 0 10px">Recent Wallet Reports</h2>
      <table class="table">
        <thead><tr><th>ID</th><th>Coin</th><th>Reported Wallet</th><th>Status</th></tr></thead>
        <tbody id="recentReports"></tbody>
      </table>
    </div>
  </main>

  <div id="wrModal" class="wr-modal" aria-hidden="true">
    <div class="wr-modal-backdrop" data-close></div>
    <div class="wr-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="wrModalTitle">
      <div class="wr-modal-header">
        <h2 id="wrModalTitle">Report a Wallet</h2>
        <button class="wr-modal-close" type="button" aria-label="Close" data-close>✕</button>
      </div>
      <div class="wr-modal-body">
        <div id="wallet-reporters-widget"></div>
      </div>
      <div class="wr-modal-footer"><small>We do not recover funds. We do not ask for private keys.</small></div>
    </div>
  </div>

  <script src="./main.js"></script>
  <script src="./wallet-reporters-snippet.js"></script>
<script>
(function () {
  const API = (window.WR_API_BASE || "").replace(/\/$/, "");
  if (!API) {
    alert("WR_API_BASE is not set. Add it in index.html <head>.");
    return;
  }

  function el(tag, attrs = {}, children = []) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "style") Object.assign(n.style, v);
      else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    for (const c of children) n.append(c);
    return n;
  }

  async function loadReports(wallet) {
    status.textContent = "Loading…";
    results.innerHTML = "";

    try {
      const res = await fetch(`${API}/api/reports?wallet=${encodeURIComponent(wallet)}`, {
        method: "GET"
      });
      const data = await res.json().catch(() => ({}));

      if (!res.ok || !data.ok) {
        console.error("Load failed:", res.status, data);
        status.textContent = "Failed to load reports. Check console.";
        return;
      }

      const rows = Array.isArray(data.results) ? data.results : [];
      status.textContent = rows.length ? `Found ${rows.length} report(s).` : "No reports found.";

      const table = el("table", { style: {
        width: "100%",
        borderCollapse: "collapse",
        marginTop: "12px"
      }});

      const thead = el("thead");
      const headerRow = el("tr", {}, [
        el("th", { style: thStyle }, [document.createTextNode("Time")]),
        el("th", { style: thStyle }, [document.createTextNode("Category")]),
        el("th", { style: thStyle }, [document.createTextNode("Message")]),
        el("th", { style: thStyle }, [document.createTextNode("URL")]),
        el("th", { style: thStyle }, [document.createTextNode("ID")]),
      ]);
      thead.append(headerRow);
      table.append(thead);

      const tbody = el("tbody");
      for (const r of rows) {
        const dt = r.created_at ? new Date(r.created_at * 1000).toLocaleString() : "";
        const url = r.url || "";
        const tr = el("tr", {}, [
          el("td", { style: tdStyle }, [document.createTextNode(dt)]),
          el("td", { style: tdStyle }, [document.createTextNode(r.category || "")]),
          el("td", { style: tdStyle }, [document.createTextNode(r.message || "")]),
          el("td", { style: tdStyle }, [
            url ? el("a", { href: url, target: "_blank", rel: "noreferrer" }, [document.createTextNode("link")]) : document.createTextNode("")
          ]),
          el("td", { style: tdStyle }, [document.createTextNode(r.id || "")]),
        ]);
        tbody.append(tr);
      }
      table.append(tbody);
      results.append(table);
    } catch (e) {
      console.error(e);
      status.textContent = "Network error. Check console.";
    }
  }

  const thStyle = {
    textAlign: "left",
    borderBottom: "1px solid #ddd",
    padding: "8px",
    fontWeight: "600"
  };

  const tdStyle = {
    borderBottom: "1px solid #eee",
    padding: "8px",
    verticalAlign: "top"
  };

  // Build a simple UI even if the page had nothing
  const wrapper = el("div", { style: {
    maxWidth: "900px",
    margin: "24px auto",
    padding: "0 16px",
    fontFamily: "system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
  }});

  const title = el("h1", { style: { margin: "0 0 12px 0" } }, [document.createTextNode("Wallet Reports Registry")]);
  const hint = el("div", { style: { marginBottom: "12px", color: "#555" } }, [
    document.createTextNode("Enter a wallet address to view reports stored in D1.")
  ]);

  const input = el("input", {
    type: "text",
    placeholder: "0x… wallet address",
    style: {
      width: "100%",
      padding: "10px",
      fontSize: "16px",
      border: "1px solid #ccc",
      borderRadius: "8px",
      boxSizing: "border-box"
    }
  });

  const btn = el("button", { style: {
    marginTop: "10px",
    padding: "10px 14px",
    fontSize: "16px",
    border: "0",
    borderRadius: "8px",
    cursor: "pointer"
  }, onclick: () => {
    const wallet = input.value.trim();
    if (!wallet) return alert("Enter a wallet address first.");
    // update URL for shareable links
    const u = new URL(window.location.href);
    u.searchParams.set("wallet", wallet);
    history.replaceState(null, "", u.toString());
    loadReports(wallet);
  }}, [document.createTextNode("Load reports")]);

  const status = el("div", { style: { marginTop: "12px" } }, []);
  const results = el("div", { style: { marginTop: "8px" } }, []);

  wrapper.append(title, hint, input, btn, status, results);

  // Put it at the top of <body>
  document.body.prepend(wrapper);

  // Auto-load if ?wallet= is present
  const initialWallet = new URL(window.location.href).searchParams.get("wallet");
  if (initialWallet) {
    input.value = initialWallet;
    loadReports(initialWallet);
  }
})();
</script>
</body>
</html>
